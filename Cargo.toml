[package]
name = "nrzmail"
version = "1.5.1"
edition = "2021"
description = "nrzMail – selbst gehosteter Mail-Client und Mail-Archiv in Rust (Rocket, SQLCipher, Dioxus)"
license = "AGPL-3.0-or-later"
rust-version = "1.85"

[dependencies]
# API-Typen, gemeinsam mit der Oberfläche
nrzmail-api = { path = "shared" }

# Web
rocket = { version = "=0.5.4", features = ["secrets", "json"] }
# Rocket, rocket_http und rocket_codegen immer auf dieselbe feste Version setzen
# (0.5.4: hyper 1.x / h2 0.4, behebt GHSA-q83h-524g-xf6h).
rocket_http = "=0.5.4"
rocket_codegen = "=0.5.4"

# Datenbank: eine einzige SQLite-Datei, komplett mit SQLCipher verschlüsselt.
# libsqlite3-sys wird hier nur aufgeführt, um für sqlx die SQLCipher-Variante
# (inkl. FTS5) einzuschalten – Cargo vereinigt die Features beider Abhängigkeiten.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
libsqlite3-sys = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }

# Laufzeit & Hilfen
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "sync", "time", "io-util", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }

# Sicherheit
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Mail: IMAP (Empfangen), SMTP (Senden), Zerlegen, Bereinigen von HTML, Archiv-Formate
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
mail-parser = "0.11"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "ring", "hostname"] }
ammonia = "4"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

# KI: ausgehende Anfragen (rustls, keine zweite OpenSSL)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[build-dependencies]
flate2 = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
